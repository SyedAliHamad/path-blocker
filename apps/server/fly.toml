# Deploy from the repository root, so the Docker build context is the whole
# workspace (the Dockerfile copies it to satisfy npm ci):
#   fly deploy . --config apps/server/fly.toml
#   fly secrets set ALLOWED_ORIGINS=https://your-domain --app path-blocker-server
#
# dockerfile is resolved relative to this file, not to the build context.
app = "path-blocker-server"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  # Games live in the memory of one machine, so it must not be stopped
  # underneath a game in progress.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
